spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:h2:mem:stockflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10      # Enough for a medium-load demo application.
      minimum-idle: 5            # Keeps a few ready connections available.
      connection-timeout: 30000  # Wait up to 30s for a connection.
      idle-timeout: 600000       # Close idle connections after 10 minutes.
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
    app:
      name: StockFlow Inventory Service
      version: 1.0.0
      description: Inventory monitoring backend service for evaluation of Mario Mencia

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      stockAlerts:
        sliding-window-type: count_based
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      movementRegistration:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  ratelimiter:
    instances:
      movementHistory:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0
